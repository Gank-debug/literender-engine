name: Mac app

# Assembles LiteRender.app on a real Mac and signs it with Apple's own codesign,
# so the signature is valid (a broken signature is what makes macOS say an app
# is "damaged"). Inputs: the Electron runtime, LiteRender's app files
# (mac/payload/app, pushed from the LiteRender build) and the newest lr_engine
# Mac build. If Apple Developer ID secrets are set, it also signs with that
# identity and notarizes, so the app opens with no warning at all.
#
# Optional secrets: MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, MAC_SIGN_IDENTITY,
#                   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER

on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac-app.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON: 44.9.3

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Electron runtime
        run: |
          curl -sSL -o electron.zip "https://github.com/electron/electron/releases/download/v$ELECTRON/electron-v$ELECTRON-darwin-arm64.zip"
          curl -sSL -o SHASUMS256.txt "https://github.com/electron/electron/releases/download/v$ELECTRON/SHASUMS256.txt"
          want=$(grep " \*electron-v$ELECTRON-darwin-arm64.zip" SHASUMS256.txt | awk '{print $1}')
          got=$(shasum -a 256 electron.zip | awk '{print $1}')
          test "$want" = "$got"
          mkdir out && ditto -x -k electron.zip out

      - name: Newest engine build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep '^engine-' | head -1)
          echo "engine release: $TAG"
          gh release download "$TAG" -p lr_engine-macos-arm64.zip
          ditto -x -k lr_engine-macos-arm64.zip enginepkg

      - name: Assemble LiteRender.app
        run: |
          VER=$(cat mac/VERSION)
          mv out/Electron.app out/LiteRender.app
          C=out/LiteRender.app/Contents
          rm -f "$C/Resources/default_app.asar"
          cp -R mac/payload/app "$C/Resources/app"
          cp -R enginepkg/engine "$C/Resources/engine"
          P="$C/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName LiteRender" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LiteRender" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.gank.literender" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$P"
          # a real icon set from the app icon
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s mac/payload/app/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) mac/payload/app/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$C/Resources/electron.icns"
          xattr -cr out/LiteRender.app

      - name: Sign (inside out)
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12PW: ${{ secrets.MAC_CERT_PASSWORD }}
          IDENT: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          APP=out/LiteRender.app
          SIGN="-"; OPTS=""
          if [ -n "$P12" ] && [ -n "$IDENT" ]; then
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            echo "$P12" | base64 --decode > cert.p12
            security import cert.p12 -k build.keychain -P "$P12PW" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain >/dev/null
            SIGN="$IDENT"; OPTS="--options runtime --timestamp --entitlements mac/entitlements.plist"
            echo "signing with Developer ID"
          else
            echo "no Developer ID secrets: ad-hoc signature (valid, but macOS asks once: Privacy & Security > Open Anyway)"
          fi
          # 1. loose code inside Resources (engine + any native modules)
          find "$APP/Contents/Resources" -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.node" -o -perm -u+x \) | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then codesign --force --sign "$SIGN" $OPTS "$f"; fi
          done
          # 2. frameworks and helper apps, deepest first
          find "$APP/Contents/Frameworks" -depth \( -name "*.framework" -o -name "*.app" \) | while read -r b; do
            codesign --force --sign "$SIGN" $OPTS "$b"
          done
          # 3. the app itself
          codesign --force --sign "$SIGN" $OPTS "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "signature OK"

      - name: Test the engine inside the app
        run: |
          python3 tools/make_test_job.py testjob
          out/LiteRender.app/Contents/Resources/engine/lr_engine testjob --device cpu | tr '\r' '\n' | tail -5
          test -s testjob/render.exr

      - name: Notarize (Developer ID only)
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEYID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IDENT: ${{ secrets.MAC_SIGN_IDENTITY }}
        if: env.KEY != '' && env.IDENT != ''
        run: |
          echo "$KEY" | base64 --decode > key.p8
          ditto -c -k --keepParent out/LiteRender.app notarize.zip
          xcrun notarytool submit notarize.zip --key key.p8 --key-id "$KEYID" --issuer "$ISSUER" --wait
          xcrun stapler staple out/LiteRender.app

      - name: Gatekeeper report
        run: |
          spctl -a -t exec -vv out/LiteRender.app 2>&1 | tee gatekeeper.txt || true
          codesign -dv out/LiteRender.app 2>&1 | tee -a gatekeeper.txt

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat mac/VERSION)
          mkdir -p dist/LiteRender
          ditto out/LiteRender.app dist/LiteRender/LiteRender.app
          cp mac/README.txt dist/LiteRender/README.txt
          (cd dist && ditto -c -k --sequesterRsrc --keepParent LiteRender ../LiteRender_Desktop_${VER}_Mac.zip)
          ls -la LiteRender_Desktop_${VER}_Mac.zip
          TAG=mac-${{ github.run_number }}
          gh release create "$TAG" --title "LiteRender $VER for Mac (build ${{ github.run_number }})" --notes "Signed on macOS" --prerelease
          gh release upload "$TAG" LiteRender_Desktop_${VER}_Mac.zip gatekeeper.txt --clobber
