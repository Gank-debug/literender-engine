<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Respite Look Test</title>
<style>
:root{--bg:#070608;--fg:#e6d8bd;--dim:#9a8d7a;--line:#3a3038;--acc:#c9a35a}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 Georgia,serif;height:100%;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;max-width:100vw;max-height:100vh}
.bar{position:fixed;left:0;right:0;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 10px}
.top{position:fixed;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
button{background:#15111a;color:var(--fg);border:1px solid var(--line);padding:7px 12px;font:inherit;cursor:pointer;border-radius:2px}
button.on{border-color:var(--acc);color:#f3e2bd;background:#221a12}
#hp{letter-spacing:.08em} #msg{color:var(--dim);text-align:right;max-width:52ch} #note{color:var(--dim);font-size:12px;margin-top:2px}
</style></head><body>
<div id="wrap"><canvas id="c" width="1280" height="940"></canvas></div>
<div class="top"><div><div id="hp">THE KNIGHT</div><div id="note"></div></div><div id="msg">Loading…</div></div>
<div class="bar"><button data-look="current">Current</button><button data-look="B">B · pixels + light</button><button data-look="hybrid">Hybrid · rendered room</button><button data-look="A">A · all rendered</button><button id="end">End turn</button><button id="reset">Reset</button></div>
<script>
const cv=document.getElementById('c'), g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
const NOTE={current:'Our game as it is: outlined pixel sprites, even light.',B:'Same pixels and pipeline: a light pool that follows the Knight, deep dark, earthy palette, grit, a faint silhouette.',
  hybrid:'The room fully rendered (textured, real light); our characters at 2x, no outline, lit by the room.',A:'Everything fully rendered: room and characters, real soft shadows. Fewer animation frames in this test.'};
let MAN, ROOM, IMG={}, look='B', units=[], knight, phase='player', busy=false, moved=false, msgT='';
const load=src=>new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; });
const P2=()=>ROOM.p2, W2S=(x,y,z=0)=>{ const p=P2(); return [p.o[0]+p.ex[0]*x+p.ey[0]*y+p.ez[0]*z, p.o[1]+p.ex[1]*x+p.ey[1]*y+p.ez[1]*z]; };
const tileW=(i,j)=>[ROOM.X0+(i+.5)*ROOM.T, ROOM.Y0+(j+.5)*ROOM.T];
function S2W(sx,sy){ const p=P2(), a=p.ex[0], b=p.ey[0], c=p.ex[1], d=p.ey[1], det=a*d-b*c, X=sx-p.o[0], Y=sy-p.o[1]; return [(d*X-b*Y)/det,(-c*X+a*Y)/det]; }
const BLOCK=new Set();
const key=(i,j)=>i+','+j, inside=(i,j)=>i>=0&&j>=0&&i<ROOM.NX&&j<ROOM.NY, occ=(i,j,me)=>units.some(u=>u!==me&&!u.dead&&u.i===i&&u.j===j);
const cheb=(a,i,j)=>Math.max(Math.abs(a.i-i),Math.abs(a.j-j)), rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function bfs(u,n){ const D=new Map([[key(u.i,u.j),[0,null]]]), q=[[u.i,u.j]]; while(q.length){ const [i,j]=q.shift(), d=D.get(key(i,j))[0]; if(d>=n) continue;
  for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){ const a=i+di,b=j+dj,k=key(a,b); if(!inside(a,b)||BLOCK.has(k)||occ(a,b,u)||D.has(k)) continue; D.set(k,[d+1,[i,j]]); q.push([a,b]); } } return D; }
const pathTo=(D,i,j)=>{ const p=[]; let c=[i,j]; while(c){ p.unshift(c); const e=D.get(key(...c)); c=e&&e[1]; } return p.slice(1); };
function face(u,ti,tj){ const [x0,y0]=tileW(u.i,u.j), [x1,y1]=tileW(ti,tj); if(x0===x1&&y0===y1) return; const r=Math.atan2(x1-x0,-(y1-y0))*180/Math.PI; u.face=r; }
const sheetOf=u=>MAN.looks[look][u.kind];
function setPose(u,p,done){ u.pose=p; u.f=0; u.t=0; u.hold=0; u.done=done||null; }
function step(u,dt){ const S=sheetOf(u), P=S.poses[u.pose]; if(!P) return; u.t+=dt*1000; const ms=P.ms+((P.hold||{})[u.f]||0)*P.ms;
  if(u.t>=ms){ u.t-=ms; if(u.f<P.frames-1) u.f++; else if(P.loop) u.f=0; else if(u.done){ const d=u.done; u.done=null; d(); } }
  if(u.path&&u.path.length){ const [ti,tj]=u.path[0], [tx,ty]=tileW(ti,tj); const dx=tx-u.x, dy=ty-u.y, L=Math.hypot(dx,dy), sp=2.6*dt;
    if(L<=sp){ u.x=tx; u.y=ty; u.i=ti; u.j=tj; u.path.shift(); if(u.path.length) face(u,...u.path[0]); else { setPose(u,'idle'); const cb=u.arrive; u.arrive=null; cb&&cb(); } } else { u.x+=dx/L*sp; u.y+=dy/L*sp; } } }
function lightAt(x,y){ const L=ROOM.lights, k=knight, d=(a,b,r)=>Math.exp(-((Math.hypot(x-a,y-b)/r)**2));
  return look==='current'?1:Math.min(1.15,.32+.95*d(k.x,k.y,3.2)+.7*d(L.candle[0],L.candle[1],2.6)+.35*d(L.spring[0],L.spring[1],2.0)); }
function drawUnit(u){ const S=sheetOf(u), P=S.poses[u.pose]; const im=IMG[P.file]; if(!im) return; const nd=S.dirs, az=((45-u.face)%360+360)%360, row=Math.round(az/(360/nd))%nd;
  const f=Math.min(u.f,P.frames-1), k=S.scale===1?2:1, [sx,sy]=W2S(u.x,u.y), an=P.anchor[row];
  if(look==='B'||look==='hybrid'){ g.fillStyle='rgba(0,0,0,.42)'; g.beginPath(); g.ellipse(sx+6,sy+3,u.kind==='knight'?34:28,13,0,0,6.283); g.fill(); }
  const Lv=lightAt(u.x,u.y); g.filter=look==='current'?'none':(look==='B'?`saturate(.8) sepia(.12) brightness(${Lv.toFixed(2)})`:`brightness(${Lv.toFixed(2)})`);
  if(u.flash>0){ g.filter+=' brightness(1.8)'; }
  g.drawImage(im,f*P.w,row*P.h,P.w,P.h,Math.round(sx-an[0]*k),Math.round(sy-an[1]*k),P.w*k,P.h*k); g.filter='none'; }
const dark=document.createElement('canvas'); dark.width=1280; dark.height=940; const dg=dark.getContext('2d');
function overlay(){ if(look==='current') return; const a=look==='B'?.42:.5; dg.globalCompositeOperation='source-over'; dg.clearRect(0,0,1280,940); dg.fillStyle=`rgba(4,3,6,${a})`; dg.fillRect(0,0,1280,940);
  dg.globalCompositeOperation='destination-out'; const hole=(x,y,r,s)=>{ const [sx,sy]=W2S(x,y,.4); const gr=dg.createRadialGradient(sx,sy,0,sx,sy,r); gr.addColorStop(0,`rgba(0,0,0,${s})`); gr.addColorStop(1,'rgba(0,0,0,0)'); dg.fillStyle=gr; dg.beginPath(); dg.ellipse(sx,sy,r,r*.62,0,0,6.283); dg.fill(); };
  hole(knight.x,knight.y,330,1); hole(ROOM.lights.candle[0],ROOM.lights.candle[1],220,.9); hole(ROOM.lights.spring[0],ROOM.lights.spring[1],170,.7);
  g.drawImage(dark,0,0); const [kx,ky]=W2S(knight.x,knight.y,.5); const gr=g.createRadialGradient(kx,ky,0,kx,ky,260); gr.addColorStop(0,'rgba(255,190,120,.10)'); gr.addColorStop(1,'rgba(255,190,120,0)');
  g.globalCompositeOperation='lighter'; g.fillStyle=gr; g.fillRect(0,0,1280,940); g.globalCompositeOperation='source-over'; }
function diamond(i,j,fill,stroke){ const [x,y]=tileW(i,j), h=ROOM.T/2, c=[[x-h,y-h],[x+h,y-h],[x+h,y+h],[x-h,y+h]].map(p=>W2S(...p)); g.beginPath(); g.moveTo(...c[0]); for(const p of c.slice(1)) g.lineTo(...p); g.closePath(); if(fill){ g.fillStyle=fill; g.fill(); } if(stroke){ g.strokeStyle=stroke; g.lineWidth=1.5; g.stroke(); } }
let reach=null, last=0;
function frame(t){ const dt=Math.min(.05,(t-last)/1000); last=t; requestAnimationFrame(frame); if(!MAN) return;
  g.fillStyle='#070608'; g.fillRect(0,0,1280,940); const bg=IMG['bg_'+(look==='current'?'cur':look==='B'?'B':'A')]; if(bg){ const k=bg.width<1000?2:1; g.drawImage(bg,0,0,bg.width*k,bg.height*k); }
  if(phase==='player'&&!busy&&!knight.dead){ if(!moved){ reach=bfs(knight,3); for(const k of reach.keys()){ const [i,j]=k.split(',').map(Number); if(i!==knight.i||j!==knight.j) diamond(i,j,'rgba(120,150,190,.10)','rgba(150,180,220,.35)'); } }
    for(const u of units) if(u.kind==='myc'&&!u.dead&&cheb(knight,u.i,u.j)===1) diamond(u.i,u.j,'rgba(200,60,50,.16)','rgba(230,90,70,.6)'); }
  for(const u of units){ step(u,dt); if(u.flash>0) u.flash-=dt; }
  const order=units.slice().sort((a,b)=>(a.dead?-1:0)-(b.dead?-1:0)||W2S(a.x,a.y)[1]-W2S(b.x,b.y)[1]); for(const u of order) drawUnit(u);
  overlay(); document.getElementById('hp').textContent='THE KNIGHT  '+Math.max(0,knight.hp)+' / 50'; document.getElementById('msg').textContent=msgT; }
function say(s){ msgT=s; }
function attack(a,t,lo,hi,after){ face(a,t.i,t.j); busy=true; const P=sheetOf(a).poses.attack, hit=Math.floor(P.frames*.55);
  setPose(a,'attack',()=>{ setPose(a,'idle'); busy=false; after&&after(); });
  const chk=setInterval(()=>{ if(a.pose!=='attack'||a.f>=hit){ clearInterval(chk); if(Math.random()<.9){ const n=rnd(lo,hi); t.hp-=n; t.flash=.12; say((a.kind==='knight'?'The Knight cuts the mycelid for ':'A mycelid claws the Knight for ')+n+'.');
      if(t.hp<=0){ t.dead=true; t.path=null; setPose(t,'die'); } else { setPose(t,'hurt',()=>setPose(t,'idle')); } } else say('Miss.'); } },30); }
function enemyPhase(){ phase='enemy'; const live=units.filter(u=>u.kind==='myc'&&!u.dead); let k=0;
  const next=()=>{ if(knight.dead){ say('The Knight falls. Reset to try again.'); return; } if(k>=live.length){ phase='player'; moved=false; say('Your turn: click a tile to move, a mycelid beside you to strike.'); return; } const u=live[k++]; if(u.dead) return next();
    if(cheb(u,knight.i,knight.j)===1) return attack(u,knight,3,6,()=>setTimeout(next,150));
    const D=bfs(u,2); let best=null,bd=1e9; for(const [kk,[d]] of D){ const [i,j]=kk.split(',').map(Number); const h=cheb({i,j},knight.i,knight.j); if(h<1) continue; const sc=h*10+d; if(sc<bd){bd=sc;best=[i,j];} }
    if(!best||(best[0]===u.i&&best[1]===u.j)) return setTimeout(next,80);
    u.path=pathTo(D,...best); face(u,...u.path[0]); setPose(u,'walk'); u.arrive=()=>{ if(cheb(u,knight.i,knight.j)===1) attack(u,knight,3,6,()=>setTimeout(next,150)); else setTimeout(next,80); }; };
  next(); }
cv.addEventListener('pointerdown',e=>{ if(phase!=='player'||busy||knight.dead) return; const r=cv.getBoundingClientRect(), sx=(e.clientX-r.left)*1280/r.width, sy=(e.clientY-r.top)*940/r.height; const [x,y]=S2W(sx,sy);
  const i=Math.floor((x-ROOM.X0)/ROOM.T), j=Math.floor((y-ROOM.Y0)/ROOM.T); if(!inside(i,j)) return;
  const t=units.find(u=>u.kind==='myc'&&!u.dead&&u.i===i&&u.j===j); if(t){ if(cheb(knight,i,j)===1) attack(knight,t,7,12,()=>enemyPhase()); return; }
  if(!moved&&reach&&reach.has(key(i,j))&&(i!==knight.i||j!==knight.j)){ moved=true; busy=true; knight.path=pathTo(reach,i,j); face(knight,...knight.path[0]); setPose(knight,'walk'); knight.arrive=()=>{ busy=false; if(!units.some(u=>u.kind==='myc'&&!u.dead&&cheb(knight,u.i,u.j)===1)) enemyPhase(); }; } });
document.getElementById('end').onclick=()=>{ if(phase==='player'&&!busy) enemyPhase(); };
function reset(){ const mk=(kind,i,j,hp)=>{ const [x,y]=tileW(i,j); const u={kind,i,j,x,y,hp,face:0,dead:false,flash:0}; setPose(u,'idle'); return u; };
  knight=mk('knight',1,4,50); face(knight,4,2); units=[knight,mk('myc',5,4,9),mk('myc',6,2,9),mk('myc',4,0,9),mk('myc',6,5,9)]; for(const u of units.slice(1)) face(u,1,4);
  phase='player'; moved=false; busy=false; say('Your turn: click a tile to move, a mycelid beside you to strike.'); }
function setLook(l){ if(!MAN.looks[l]) return; look=l; document.querySelectorAll('[data-look]').forEach(b=>b.classList.toggle('on',b.dataset.look===l)); document.getElementById('note').textContent=NOTE[l]; }
document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>setLook(b.dataset.look));
document.getElementById('reset').onclick=reset;
(async()=>{ MAN=await (await fetch('manifest.json')).json(); ROOM=MAN.room; for(const [n,i,j] of ROOM.props) if(n!=='corpse') BLOCK.add(key(i,j));
  const files=new Set(['bg_cur.png','bg_B.png','bg_A.png']); for(const L of Object.values(MAN.looks)) for(const C of Object.values(L)) for(const P of Object.values(C.poses)) files.add(P.file);
  let n=0; await Promise.all([...files].map(async f=>{ const im=await load(f); IMG[f.startsWith('bg_')?f.replace('.png',''):f]=im; msgT='Loading… '+(++n)+' / '+files.size; }));
  document.querySelectorAll('[data-look]').forEach(b=>{ if(!MAN.looks[b.dataset.look]){ b.disabled=true; b.title='still rendering'; } });
  reset(); setLook(MAN.looks.B?'B':'current'); requestAnimationFrame(frame); })();
</script></body></html>
