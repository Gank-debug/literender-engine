<style>
:root{--bg:#0b0a0a;--panel:rgba(24,20,18,.9);--ink:#e8d8b0;--dim:#9a8e78;--acc:#c0602a;--cold:#8cc8ff}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:14px/1.3 Georgia,serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:fixed;left:0;top:0}
.hud{position:fixed;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75) 40%)}
button{background:var(--panel);color:var(--ink);border:1px solid #3a322b;padding:8px 12px;font:inherit;border-radius:3px;cursor:pointer}
button.on{border-color:var(--acc);background:#3a2014;color:#fff} button:disabled{opacity:.35;cursor:default}
.top{position:fixed;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}
.name{letter-spacing:.12em;font-size:15px}.hp{font-size:12px;color:var(--dim);margin-top:2px}
.bar{width:150px;height:6px;background:#2a1a16;margin-top:5px;border:1px solid #3a2a22}.bar i{display:block;height:100%;background:#a23a26;transition:width .3s}
.turn{text-align:center;font-size:13px;letter-spacing:.08em}.turn b{color:#fff;font-weight:normal}.turn .k{color:var(--cold)}
.order{display:flex;gap:6px;justify-content:center;margin-top:5px}.order span{font-size:11px;padding:2px 7px;border:1px solid #3a322b;background:var(--panel);color:var(--dim)}.order span.now{border-color:var(--acc);color:#fff}
.log{font-size:12px;color:var(--dim);text-align:right;max-width:34%;line-height:1.45}
.log div:first-child{color:var(--ink)}
.card{opacity:.55;margin-bottom:8px}.card.now{opacity:1}.card.now .name{color:#fff}.card.dead{opacity:.3}
.mp{width:150px;height:3px;background:#141a2a;margin-top:3px;border:1px solid #2a2a3a}.mp i{display:block;height:100%;background:#5a8ad0;transition:width .3s}
.gvp{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;display:none;gap:14px;align-items:center;background:var(--panel);border:1px solid #3a322b;padding:6px 12px;font-size:12px;color:var(--dim)}.gvp.on{display:flex}.gvp b{color:#cfe6ff;font-weight:normal}.gvp input{width:110px;accent-color:#8cc8ff}
@media (max-width:760px){ .hud{gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))} .hud button,.hud select{padding:6px 8px;font-size:12px} .gvp{width:calc(100% - 24px);justify-content:center;flex-wrap:wrap;gap:6px 10px;box-sizing:border-box} .gvp label{display:flex;align-items:center;gap:6px;width:46%} .gvp input{flex:1;min-width:0} }
.wr{width:150px;height:3px;background:#1a1a24;margin-top:3px;border:1px solid #2a2a3a}.wr i{display:block;height:100%;background:#d0a040;transition:width .3s}
#pick{position:fixed;inset:0;background:rgba(8,7,10,.86);display:none;align-items:center;justify-content:center;z-index:50}
#pick.on{display:flex} #pick .pp{background:#16131a;border:1px solid #3a3240;padding:18px 20px;max-width:560px;width:calc(100% - 32px);color:#e8dcc4;font:14px/1.4 Georgia,serif}
#pick h3{margin:0 0 4px;font-weight:normal;letter-spacing:.08em} #pick .sub{color:#9a8f80;font-size:12px;margin-bottom:12px}
#pick .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px} #pick .h{border:1px solid #3a3240;background:#1d1922;color:#cbbfa8;padding:8px 10px;text-align:left;cursor:pointer;font:inherit}
#pick .h.sel{border-color:#c9a35a;background:#2a2218;color:#f1e3c2} #pick .h small{display:block;color:#8e8474;font-size:11px}
#pick .go{margin-top:14px;width:100%;padding:10px;background:#c9a35a;color:#16131a;border:0;font:inherit;letter-spacing:.06em;cursor:pointer} #pick .go:disabled{background:#4a4234;color:#8e8474;cursor:default}

/* ---- the game's UI, after The Hollow Brother: framed panels, blackletter heads with a red drop cap, pixel body type */
:root{--hf:'Jacquard 24',serif;--hc:#d8b060;--cap:#c43a32;--ink:#ece2c8;--dim:#9a8f78;--rule:#2e2620;--hl:rgba(196,58,50,.14);--bb:1px solid #5a4630;--bbg:linear-gradient(#2a2018,#17110c)}
body,button,select{font-family:'Pixelify Sans',monospace}
.v{background:radial-gradient(ellipse at 30% 0%,rgba(80,60,40,.25),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),#15100c;border:2px solid #4a3a28;outline:2px solid #0a0706;box-shadow:inset 0 0 0 4px #15100c,inset 0 0 0 5px #6a5236,0 10px 30px rgba(0,0,0,.7);position:relative;pointer-events:auto}
.v:before,.v:after{content:'';position:absolute;width:12px;height:12px;background:#3c3a3a;box-shadow:inset 2px 2px #6a6866,inset -2px -2px #1a1818,0 0 0 2px #0a0706}
.v:before{left:-7px;top:-7px} .v:after{right:-7px;bottom:-7px}
.hd{font-family:var(--hf);color:var(--hc);font-size:28px;line-height:1.15;padding-top:2px;letter-spacing:.5px;margin-bottom:6px} .hd .cap{color:var(--cap);font-size:1.25em}
.top{left:12px;right:12px;top:12px}
#party{width:270px;padding:10px 12px}
.s{display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--rule)} .s:last-child{border-bottom:0}
.s .pt{width:44px;height:44px;object-fit:none;object-position:50% 0;background:radial-gradient(ellipse at 50% 30%,#3a2c22,#120d0a 75%);border:1px solid #6a5236;box-shadow:0 0 0 1px #0a0706;image-rendering:pixelated;display:block}
.s b{font-family:var(--hf);font-weight:normal;font-size:22px;color:var(--ink);line-height:1.1} .s b i{font-style:normal;color:var(--cap)} .s small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.s.now{background:var(--hl);box-shadow:inset 2px 0 var(--cap)} .s.dead{opacity:.45} .s.dead b{text-decoration:line-through}
.s .bars{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.s .bars span{display:block;height:4px;background:#241a14;box-shadow:0 0 0 1px #0a0706} .s .bars span i{display:block;height:100%;transition:width .3s}
.s .hpb i{background:#a83a26} .s .mpb i{background:#4f7fc4} .s .wrb i{background:#d0a040} .s .fcb i{background:#8cc49a}
.turn{padding:8px 16px;display:flex;align-items:center;gap:14px} #turnt{font-family:var(--hf);font-size:30px;line-height:1.2;color:var(--hc);white-space:nowrap} #turnt b{font-family:'Pixelify Sans';font-size:14px;color:var(--ink);font-weight:500} #turnt .k{font-family:'Pixelify Sans';font-size:14px;color:#e07a5a}
.order{margin:0;gap:2px} .order span{font-size:13px;padding:3px 8px;border:0;background:none;color:var(--dim)} .order span.now{color:#1a120c;background:var(--hc)} .order span.foe{color:#c8806a} .order span.now.foe{background:#c86a50;color:#1a0c08}
.log{width:300px;max-width:none;text-align:left;padding:10px 12px;font-size:13px;line-height:1.4} .log div{padding:3px 0;border-bottom:1px solid var(--rule);color:var(--dim)} .log div:first-of-type{color:var(--ink)} .log div:last-child{border-bottom:0}
.hud.v{position:fixed;left:50%;right:auto;transform:translateX(-50%);bottom:12px;padding:10px 12px;background:none;flex-wrap:nowrap;gap:8px}
.hud button,.btn{white-space:nowrap;padding:7px 14px;font-size:15px;color:var(--ink);border:var(--bb);background:var(--bbg);border-radius:0;line-height:1.15}
.hud button small,.btn small{display:block;font-size:11px;color:var(--dim)} .hud button.on{color:var(--hc);border-color:var(--hc);background:var(--bbg)} .hud button:disabled{opacity:.4}
#end{color:var(--hc);border-color:var(--hc)}
.corner{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;z-index:20} .corner button{padding:7px 10px;font-size:14px;color:var(--ink);border:var(--bb);background:var(--bbg);border-radius:0}
.drawer.v{position:fixed;right:12px;bottom:64px;width:300px;padding:12px;display:none;z-index:20} .drawer.v.on{display:block}
.drawer .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px} .drawer button,.drawer select{padding:6px 10px;font-size:13px;color:var(--ink);border:var(--bb);background:var(--bbg);border-radius:0} .drawer label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:4px 0}
.drawer .k{font-size:11px;letter-spacing:2px;color:var(--dim);margin:6px 0 4px}
#legacy{display:none}
#satp .it{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--rule)} #satp .it b{font-weight:500;font-size:14px;color:var(--ink)} #satp .it small{display:block;font-size:11px;color:var(--dim)}
.ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-size:24px;color:var(--cap);background:#1f1612;border:1px solid #6a5236}
#guide{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)} #guide.on{display:flex}
#guide .v{width:min(880px,calc(100% - 40px));max-height:calc(100% - 60px);overflow:auto;padding:22px 22px 18px}
#guide .hd{font-size:40px} #guide .intro{font-size:13px;color:var(--dim);line-height:1.45;margin-bottom:10px}
#guide .tabs{display:flex;gap:2px;margin-bottom:12px} #guide .tabs span{font-size:15px;padding:4px 12px;color:var(--dim);cursor:pointer} #guide .tabs span.on{color:#1a120c;background:var(--hc)}
#guide .x{position:absolute;right:14px;top:12px;cursor:pointer;color:var(--dim);font-size:18px}
#guide .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:760px){ #guide .grid{grid-template-columns:1fr} }
#guide .card{border:1px solid #4a3a28;background:linear-gradient(#1d1511,#150f0c);padding:10px 12px} #guide .card.foe{background:linear-gradient(#22120f,#160c0a)}
#guide .ch{display:flex;gap:8px;align-items:flex-start} #guide .dc{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-size:34px;color:var(--cap);background:#1f1612;border:1px solid #6a5236;image-rendering:pixelated}
